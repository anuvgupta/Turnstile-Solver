# Turnstile Solver — Camoufox-based Cloudflare Turnstile bypass
# Runs on seedlo (Unraid), cloned at /mnt/user/workspace/Turnstile-Solver.
# Managed by Unraid Compose Manager via include from the media-stack compose.
services:
  turnstile-solver:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: turnstile-solver
    restart: unless-stopped
    init: true
    environment:
      - RUN_API_SOLVER=true
      - TZ=America/Chicago
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s